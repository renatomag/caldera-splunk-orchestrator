namespace: credential_access

detections:
  lsass_dump:
    display_name: "LSASS Memory Dump"
    mitre_technique: T1003.001
    splunk_index: notable
    search_name_pattern: "*LSASS*"
    fallback_spl: >
      index=wineventlog EventCode=1
      (Image="*procdump*" OR CommandLine="*lsass*")
      | stats count
    severity: critical
    required: true

  procdump:
    display_name: "Procdump Execution"
    mitre_technique: T1003.001
    splunk_index: notable
    search_name_pattern: "*procdump*"
    fallback_spl: >
      index=wineventlog EventCode=1 Image="*procdump64*"
      | stats count
    severity: high
    required: false

  mimikatz:
    display_name: "Mimikatz Execution"
    mitre_technique: T1003.001
    splunk_index: notable
    search_name_pattern: "*Mimikatz*"
    fallback_spl: >
      index=wineventlog EventCode=1
      (Image="*mimikatz*" OR CommandLine="*sekurlsa*" OR CommandLine="*lsadump*")
      | stats count
    severity: critical
    required: true

  ntds_dit:
    display_name: "NTDS.dit Access"
    mitre_technique: T1003.003
    splunk_index: notable
    search_name_pattern: "*NTDS*"
    fallback_spl: >
      index=wineventlog EventCode=13
      TargetObject="*NTDS*"
      | stats count
    severity: critical
    required: false

  lsass_comsvcs:
    display_name: "LSASS Dump via comsvcs.dll MiniDump"
    mitre_technique: T1003.001
    splunk_index: notable
    search_name_pattern: "ESCU - Dump LSASS via comsvcs DLL - Rule"
    correlation_search_name: "ESCU - Dump LSASS via comsvcs DLL - Rule"
    fallback_spl: >
      index=wineventlog EventCode=1
      CommandLine="*comsvcs*"
      (CommandLine="*MiniDump*" OR CommandLine="*#24*")
      | stats count
    severity: critical
    required: true

  ntdsutil_ntds:
    display_name: "Active Directory Database Export via NTDSUtil"
    mitre_technique: T1003.003
    splunk_index: notable
    search_name_pattern: "ESCU - Ntdsutil Export NTDS - Rule"
    correlation_search_name: "ESCU - Ntdsutil Export NTDS - Rule"
    fallback_spl: >
      index=wineventlog EventCode=1
      (Image="*ntdsutil*" OR CommandLine="*ntdsutil*")
      CommandLine="*ntds*" CommandLine="*create*"
      | stats count
    severity: critical
    required: true

  spn_discovery:
    display_name: "Kerberoasting SPN Discovery via PowerShell"
    mitre_technique: T1558.003
    splunk_index: notable
    search_name_pattern: "ESCU - ServicePrincipalNames Discovery with PowerShell - Rule"
    correlation_search_name: "ESCU - ServicePrincipalNames Discovery with PowerShell - Rule"
    fallback_spl: >
      index=wineventlog source="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational" EventCode=4104
      ScriptBlockText="*KerberosRequestorSecurityToken*"
      | stats count
    severity: high
    required: true

  mimikatz_powershell:
    display_name: "Mimikatz Execution via PowerShell Script Block"
    mitre_technique: T1003.001
    splunk_index: notable
    search_name_pattern: "ESCU - Detect Mimikatz With PowerShell Script Block Logging - Rule"
    correlation_search_name: "ESCU - Detect Mimikatz With PowerShell Script Block Logging - Rule"
    fallback_spl: >
      index=wineventlog source="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational" EventCode=4104
      (ScriptBlockText="*mimikatz*" OR ScriptBlockText="*Invoke-Mimikatz*" OR ScriptBlockText="*sekurlsa*")
      | stats count
    severity: critical
    required: false

  vss_creation_wmi:
    display_name: "Volume Shadow Copy Created via WMI or vssadmin"
    mitre_technique: T1003.003
    splunk_index: notable
    search_name_pattern: "ESCU - Creation of Shadow Copy - Rule"
    correlation_search_name: "ESCU - Creation of Shadow Copy - Rule"
    fallback_spl: >
      index=wineventlog EventCode=1
      (CommandLine="*vssadmin*create*shadow*" OR CommandLine="*Win32_ShadowCopy*")
      | stats count
    severity: high
    required: true

  ntds_copy_shadow:
    display_name: "NTDS.dit Copied from Volume Shadow Copy"
    mitre_technique: T1003.003
    splunk_index: notable
    search_name_pattern: "ESCU - Credential Dumping via Copy Command from Shadow Copy - Rule"
    correlation_search_name: "ESCU - Credential Dumping via Copy Command from Shadow Copy - Rule"
    fallback_spl: >
      index=wineventlog EventCode=1
      CommandLine="*copy*" CommandLine="*ntds.dit*"
      | stats count
    severity: critical
    required: true

  lsass_createdump:
    display_name: "LSASS Memory Dumped via createdump.exe"
    mitre_technique: T1003.001
    splunk_index: notable
    search_name_pattern: "Endpoint - ESCU - Windows Credential Dumping LSASS Memory Createdump - Rule - TD SYNNEX - Rule"
    correlation_search_name: "Endpoint - ESCU - Windows Credential Dumping LSASS Memory Createdump - Rule - TD SYNNEX - Rule"
    fallback_spl: >
      index=wineventlog EventCode=1
      (Image="*createdump*" OR CommandLine="*createdump*")
      | stats count
    severity: critical
    required: true
